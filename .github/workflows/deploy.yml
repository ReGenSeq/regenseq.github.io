name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FORMSPREE_FLOWCELL_ID: ${{ secrets.VITE_FORMSPREE_FLOWCELL_ID }}
          VITE_FORMSPREE_SEQUENCER_ID: ${{ secrets.VITE_FORMSPREE_SEQUENCER_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for pages to propagate
        run: sleep 30

      - name: Run SEO smoke tests
        run: |
          node scripts/smoke-test-seo.mjs https://regenseq.github.io \
            2>&1 | tee /tmp/smoke-test-output.txt
          exit ${PIPESTATUS[0]}

      - name: Notify team on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          OUTPUT=$(cat /tmp/smoke-test-output.txt 2>/dev/null || echo "(no output captured)")
          # Truncate to stay within Slack's block text limit (3000 chars)
          OUTPUT="${OUTPUT:0:2800}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg text "❌ *SEO smoke tests failed* on \`${{ github.ref_name }}\`" \
            --arg output "$OUTPUT" \
            --arg run_url "$RUN_URL" \
            '{
              blocks: [
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $text }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: ("*Test output:*\n```" + $output + "```") }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View run" },
                      url: $run_url
                    }
                  ]
                }
              ]
            }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD"
