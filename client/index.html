        <h1>RegenSeq Open Source Community</h1>
        <p><strong>Transform Obsolete DNA Sequencers into Cutting-Edge Automation Platforms</strong></p>
        <p>RegenSeq is an NSF-funded open source ecosystem that repurposes decommissioned Illumina HiSeq 2500 DNA sequencers into flexible automation platforms for spatial biology research.</p>

        <h2>About RegenSeq</h2>
        <p>RegenSeq gives decommissioned Illumina HiSeq 2500 instruments — once costing hundreds of thousands of dollars — a second life as flexible laboratory automation platforms. By replacing proprietary sequencing chemistry with open protocols, researchers can run multiplexed immunofluorescence, spatial transcriptomics, and proteomics workflows on hardware available for a fraction of its original price on the secondary market.</p>
        <p>The project is built around PySeq2500, a fully open Python library that exposes direct control over the instrument's fluidics, temperature regulation, and four-channel fluorescence imaging system. Because every protocol is an editable Python file, researchers can adapt experiments without specialized engineering knowledge, accelerating the development of novel single-cell and spatial biology assays.</p>

        <h3>Repurpose &amp; Reuse</h3>
        <p>Convert decommissioned Illumina HiSeq 2500 sequencers — once costing hundreds of thousands — into accessible research tools available on the secondary market.</p>

        <h3>Advanced Automation</h3>
        <p>Precise control of temperature, fluidics, and imaging for complex spatial biology applications including multiplexed immunofluorescence and proteomics.</p>

        <h3>Open Source</h3>
        <p>Fully open Python codebase with customizable protocols — no specialized engineering expertise required. Community-driven development and support.</p>

        <h2>Technical Capabilities</h2>
        <p>PySeq2500 exposes every subsystem of the HiSeq 2500 through a clean Python API, letting researchers compose complex multi-day experiments from simple, reusable building blocks. The capabilities below make the platform suitable for applications ranging from cyclic immunofluorescence to in-situ sequencing.</p>
        <ul>
          <li><strong>4-Channel Imaging</strong> — Simultaneous multi-channel fluorescence image acquisition with precise positioning.</li>
          <li><strong>Temperature Control</strong> — Integrated stage temperature control for stable, reproducible experiments.</li>
          <li><strong>Automated Fluidics</strong> — Programmable reagent exchange with precise pump and valve control.</li>
          <li><strong>Custom Flow Cells</strong> — Inexpensive, easily assembled flow cells compatible with standard samples.</li>
          <li><strong>Python-Based Protocols</strong> — Editable configuration and protocol files for complete experimental control.</li>
          <li><strong>Multi-Day Workflows</strong> — Stable operation over extended experiments with unattended execution.</li>
        </ul>

        <h2>NSF POSE Phase 1 Grant — Creating an Open Source Ecosystem</h2>
        <p>The NSF Pathways to Enable Open-Source Ecosystems (POSE) Phase 1 award supports RegenSeq in transitioning from a single-lab research tool into a fully open, community-maintained ecosystem. The grant funds governance planning, community outreach, and the infrastructure needed to sustain the project beyond its founding institution at the New York Genome Center.</p>
        <p>By making high-throughput spatial biology accessible to laboratories that cannot afford commercial platforms, RegenSeq directly addresses equity gaps in the life sciences.</p>

        <h3>Broader Impacts</h3>
        <ul>
          <li><strong>Accessibility</strong> — Increase throughput and accessibility of advanced single-cell assays, enabling broader research communities to generate high-quality data for studying diseases like cancer and neurodegeneration.</li>
          <li><strong>Democratization</strong> — Lower cost and expertise barriers to automation, expanding access to cutting-edge methods beyond elite institutions and democratizing scientific research.</li>
          <li><strong>Sustainability</strong> — Model sustainable resource management by repurposing obsolete scientific instruments, fostering collaboration and environmentally responsible innovation.</li>
          <li><strong>Transparency</strong> — Give users full control over data and processing, enhancing transparency, security, and privacy compared to commercial closed-box platforms.</li>
        </ul>
